<!doctype html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>今天去哪儿？</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #20211f;
            --muted: #85847e;
            --coral: #f35f52;
            --green: #239875;
            --wheel-size: min(82vw, 430px);
        }

        * {
            box-sizing: border-box;
        }

        body {
            min-width: 280px;
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            color: var(--ink);
            background-color: #fff;
            background-image: radial-gradient(#e9e7e2 0.75px, transparent 0.75px);
            background-position: center 14px;
            background-size: 22px 22px;
            font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            display: flex;
            min-height: 100vh;
            min-height: 100svh;
            flex-direction: column;
            align-items: center;
            padding: max(38px, env(safe-area-inset-top)) 22px max(28px, env(safe-area-inset-bottom));
        }

        header {
            text-align: center;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--green);
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        h1 {
            margin: 0;
            font-family: "Songti SC", "Noto Serif CJK SC", serif;
            font-size: 30px;
            font-weight: 600;
            line-height: 1.25;
        }

        .subtitle {
            margin: 9px 0 0;
            color: var(--muted);
            font-size: 13px;
        }

        main {
            display: flex;
            width: 100%;
            flex: 1;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 28px 0 18px;
        }

        .wheel-stage {
            position: relative;
            width: var(--wheel-size);
            height: var(--wheel-size);
            flex: 0 0 auto;
            margin-top: 14px;
            filter: drop-shadow(0 16px 18px rgb(32 33 31 / 12%));
        }

        .wheel {
            position: absolute;
            inset: 0;
            overflow: hidden;
            border: 8px solid #fff;
            border-radius: 50%;
            background: conic-gradient(from -1.8deg, var(--green) 0deg 3.6deg, var(--coral) 3.6deg 360deg);
            box-shadow: inset 0 0 0 1px rgb(32 33 31 / 8%);
            transition: transform 5.5s cubic-bezier(.12, .76, .13, 1);
            will-change: transform;
        }

        .wheel::after {
            position: absolute;
            inset: 14px;
            border: 1px solid rgb(255 255 255 / 55%);
            border-radius: 50%;
            content: "";
            pointer-events: none;
        }

        .wheel-label {
            position: absolute;
            top: 73%;
            left: 50%;
            color: #fff;
            font-family: "Songti SC", "Noto Serif CJK SC", serif;
            font-size: clamp(20px, 6vw, 27px);
            font-weight: 700;
            white-space: nowrap;
            transform: translate(-50%, -50%);
            text-shadow: 0 1px 8px rgb(122 35 26 / 18%);
        }

        .pointer {
            position: absolute;
            z-index: 2;
            top: -3px;
            left: 50%;
            width: 28px;
            height: 42px;
            background: #2878c7;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            filter: drop-shadow(0 2px 3px rgb(32 33 31 / 25%));
            transform: translateX(-50%);
        }

        .spin-button {
            position: absolute;
            z-index: 3;
            top: 50%;
            left: 50%;
            display: grid;
            width: clamp(88px, 23vw, 112px);
            aspect-ratio: 1;
            place-items: center;
            padding: 0;
            border: 5px solid #fff;
            border-radius: 50%;
            color: #fff;
            background: #e9423d;
            box-shadow: 0 5px 14px rgb(117 29 24 / 24%), inset 0 -3px 0 rgb(128 23 21 / 18%);
            font: inherit;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            touch-action: manipulation;
            transform: translate(-50%, -50%);
            -webkit-tap-highlight-color: transparent;
        }

        .spin-button:active:not(:disabled) {
            box-shadow: 0 2px 7px rgb(117 29 24 / 24%), inset 0 -2px 0 rgb(128 23 21 / 18%);
            transform: translate(-50%, -48%);
        }

        .spin-button:focus-visible {
            outline: 3px solid var(--ink);
            outline-offset: 4px;
        }

        .spin-button:disabled {
            cursor: wait;
        }

        .legend {
            display: flex;
            gap: 22px;
            justify-content: center;
            margin-top: 29px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #5b5a55;
            font-size: 13px;
            white-space: nowrap;
        }

        .swatch {
            width: 9px;
            height: 9px;
            border-radius: 50%;
        }

        .swatch.pub {
            background: var(--coral);
        }

        .swatch.park {
            background: var(--green);
        }

        .result {
            min-height: 28px;
            margin: 10px 0 0;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        .result strong {
            color: var(--ink);
            font-size: 17px;
        }

        @media (max-height: 650px) {
            :root {
                --wheel-size: min(68vw, 340px);
            }

            .page {
                padding-top: max(22px, env(safe-area-inset-top));
            }

            main {
                padding: 16px 0 10px;
            }

            .legend {
                margin-top: 18px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .wheel {
                transition-duration: 1.2s;
            }
        }
    </style>
</head>

<body>
    <div class="page">
        <header>
            <p class="eyebrow">A LITTLE ADVENTURE</p>
            <h1>今天去哪儿？</h1>
            <p class="subtitle">把选择交给好运气</p>
        </header>

        <main>
            <div class="wheel-stage" aria-label="去清吧 99%，逛公园 1% 的转盘">
                <div class="wheel" id="wheel">
                    <span class="wheel-label">去清吧</span>
                </div>
                <span class="pointer" aria-hidden="true"></span>
                <button class="spin-button" id="spinButton" type="button" aria-label="开始转盘">开始</button>
            </div>

            <div class="legend" aria-label="转盘概率">
                <div class="legend-item"><span class="swatch pub"></span>去清吧</div>
                <div class="legend-item"><span class="swatch park"></span>逛公园</div>
            </div>
            <p class="result" id="result" aria-live="polite">准备好就按下按钮</p>
        </main>
    </div>

    <script>
        const wheel = document.getElementById("wheel");
        const spinButton = document.getElementById("spinButton");
        const result = document.getElementById("result");
        let currentRotation = 0;
        let selectedDestination = "去清吧";

        spinButton.addEventListener("click", () => {
            if (spinButton.disabled) return;

            const isPark = Math.random() < 0.01;
            selectedDestination = isPark ? "逛公园" : "去清吧";
            const targetAngle = isPark
                ? (Math.random() * 3.6 - 1.8 + 360) % 360
                : 1.8 + Math.random() * 356.4;
            const restingAngle = (360 - targetAngle) % 360;
            const currentAngle = ((currentRotation % 360) + 360) % 360;
            const alignment = (restingAngle - currentAngle + 360) % 360;

            currentRotation += 6 * 360 + alignment;
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            spinButton.disabled = true;
            spinButton.textContent = "...";
            result.textContent = "好运正在转动...";
        });

        wheel.addEventListener("transitionend", (event) => {
            if (event.propertyName !== "transform" || !spinButton.disabled) return;

            result.innerHTML = `这次的目的地：<strong>${selectedDestination}</strong>`;
            spinButton.disabled = false;
            spinButton.textContent = "再转一次";
        });
    </script>
</body>

</html>
